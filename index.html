<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * data: blob:; frame-src https://www.youtube-nocookie.com https://drive.google.com https://odysee.com; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>NVK PLAY</title>
<style>
:root{--bg:#070b18;--bg2:#0e1530;--card:#141c3a;--tx:#f3f5ff;--mut:#9aa4cc;--ac:#7c6cff;--ac2:#b9a8ff;--err:#ff6b6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg) 70%) no-repeat var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{min-height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding:0 20px}
.logo{font-weight:900;letter-spacing:.08em;line-height:.9;text-align:center}
.logo b{display:block;font-size:56px;background:linear-gradient(180deg,#fff,var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{display:block;font-size:20px;letter-spacing:.5em;color:var(--ac2);margin-top:6px;padding-left:.5em}
.logo.sm b{font-size:28px}.logo.sm span{font-size:10px;margin-top:3px}
.splash{flex:1;display:flex;align-items:center;justify-content:center;animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.pick{flex:1;display:flex;flex-direction:column;align-items:center;padding:28px 0 24px;animation:fade .4s ease both}
h1{font-size:26px;margin:28px 0 24px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px;width:100%;max-width:360px}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));max-width:520px}}
.pf{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.pf .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;color:var(--mut)}
.pf:active .av{transform:scale(.95)}
.av{position:relative;width:96px;height:96px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:46px;transition:transform .15s;box-shadow:0 6px 18px #0006}
.av.s{width:36px;height:36px;border-radius:10px;font-size:20px}
.av .ed{position:absolute;inset:0;border-radius:inherit;background:#000a;display:flex;align-items:center;justify-content:center;font-size:26px}
.kid{position:absolute;bottom:-6px;right:-6px;background:#2ec4b6;color:#04201d;font-size:11px;font-weight:800;border-radius:8px;padding:2px 6px}
.add .av{background:var(--card);border:2px dashed #3a4580;color:var(--ac2);font-size:40px}
.btn{padding:13px 22px;border-radius:12px;font-weight:700;background:var(--ac);color:#fff}
.btn.g{background:var(--card);color:var(--tx)}.btn.d{background:none;color:var(--err);border:1px solid #ff6b6b66}
.out{margin-top:auto;padding-top:32px}
.out .btn{border:1px solid #3a4580;background:none;color:var(--tx)}
.empty{color:var(--mut);text-align:center;margin:0 0 20px}
.form{flex:1;padding:20px 0 24px;display:flex;flex-direction:column;gap:18px;animation:fade .3s ease both}
.form h2{margin:0;font-size:22px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:6px}
input[type=text],select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #2b3566;background:var(--card);color:var(--tx);font:inherit;font-size:16px}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avs button{aspect-ratio:1;border-radius:16px;font-size:30px;display:flex;align-items:center;justify-content:center;border:3px solid transparent}
.avs button.on{border-color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:14px;padding:14px 16px}
.row small{display:block;color:var(--mut);margin-top:2px}
.sw{width:46px;height:28px;border-radius:14px;background:#2b3566;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--ac)}.sw.on::after{transform:translateX(18px)}
.err{color:var(--err);font-size:14px;min-height:18px;margin:0}
.acts{display:flex;gap:10px;flex-wrap:wrap}.acts .btn{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.top .who{display:flex;align-items:center;gap:10px;font-weight:700}
.main{flex:1;padding:8px 0 96px;animation:fade .3s ease both}
.card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:17px}.card p{margin:0;color:var(--mut);line-height:1.5;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:#0b1126f2;border-top:1px solid #1d2650;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:720px}
nav button{flex:1;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut)}
nav button i{font-style:normal;font-size:21px}
nav button.on{color:#fff}nav button.on i{filter:drop-shadow(0 0 6px var(--ac))}
textarea{width:100%;min-height:84px;padding:13px 14px;border-radius:12px;border:1px solid #2b3566;background:var(--card);color:var(--tx);font:inherit;font-size:16px;resize:vertical}
.rw{margin:0 -20px 22px}.rw h3{margin:0 20px 10px;font-size:17px}
.sl{display:flex;gap:10px;overflow-x:auto;padding:0 20px;scroll-snap-type:x proximity;scrollbar-width:none}.sl::-webkit-scrollbar,.bn::-webkit-scrollbar{display:none}
.ct{flex:none;width:112px;scroll-snap-align:start;text-align:left}
.cv{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#2a3470,#141c3a);display:flex;align-items:flex-end;padding:8px;font-size:13px;font-weight:700;line-height:1.2}
.cv img,.b img,.sheet .hd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bn{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px 22px;padding:0 20px;scrollbar-width:none}
.b{position:relative;flex:none;width:100%;aspect-ratio:4/3;max-height:380px;border-radius:18px;overflow:hidden;scroll-snap-align:center;background:linear-gradient(160deg,#3b2fd6,#141c3a);display:flex;flex-direction:column;justify-content:flex-end;padding:18px;gap:8px}
.b::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#070b18f0 10%,transparent 70%)}
.b>*:not(img){position:relative;z-index:1}
.b h2{margin:0;font-size:24px}.b p{margin:0;color:#d5daf5;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rt{align-self:flex-start;background:#fff;color:#000;font-weight:800;font-size:12px;padding:2px 7px;border-radius:6px}
.b .btn{align-self:flex-start;padding:10px 16px}
.mdl{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);width:100%;max-width:720px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .hd{position:relative;aspect-ratio:16/9;background:linear-gradient(160deg,#3b2fd6,#141c3a)}
.sheet .bd{padding:18px 20px;display:flex;flex-direction:column;gap:12px}.sheet h2{margin:0}.sheet p{margin:0;color:var(--mut);line-height:1.5}
.sheet .acts{margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 14px;padding:0 20px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--card);font-size:14px}.chip.on{background:var(--ac);font-weight:700}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.gr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.gr .ct{width:auto}
@media(min-width:520px){.gr{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cnt{color:var(--mut);font-size:13px;margin:0 0 10px}
.dh{position:relative;aspect-ratio:16/9;margin:0 -20px;background:linear-gradient(160deg,#3b2fd6,#141c3a)}.dh img,.et img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dh::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,transparent 60%)}
.bk{position:absolute;top:12px;left:16px;z-index:2;width:40px;height:40px;border-radius:50%;background:#000a;font-size:20px}
.dt{display:flex;gap:14px;margin-top:-44px;position:relative;z-index:1;align-items:flex-end;margin-bottom:14px}.dt .cv{width:96px;flex:none}.dt h1{margin:0 0 8px;text-align:left;font-size:22px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;margin:0}.dl dt{color:var(--mut)}.dl dd{margin:0}
.sec{margin:22px 0 10px;font-size:17px}
.ep{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px}
.et{position:relative;flex:none;width:112px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:linear-gradient(160deg,#2a3470,#141c3a)}
.ep p{margin:4px 0;color:var(--mut);font-size:13px;line-height:1.4}
.pl{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);touch-action:manipulation}
.pw{position:sticky;top:0;z-index:5;aspect-ratio:16/9;max-height:70vh;width:100%;background:#000}
.pw:fullscreen{max-height:none;aspect-ratio:auto;height:100%}
.pw:not(:fullscreen) .pc{padding-top:0;padding-bottom:0}
.pi{padding:16px 20px 40px;max-width:720px;margin:0 auto}.pi .row{width:100%;text-align:left;margin:12px 0;color:var(--tx)}
.pi .ep{width:100%;text-align:left;color:var(--tx)}.pi .ep.on{outline:2px solid var(--ac)}
.pl video{width:100%;height:100%;object-fit:contain;background:#000}
.pc{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(#000a,transparent 25%,transparent 65%,#000c);transition:opacity .25s;padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px)}
.pc.h{opacity:0;pointer-events:none}
.pt{display:flex;align-items:center;gap:10px;padding-top:12px}.pt button{width:40px;height:40px;font-size:22px}.pt span{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm{display:flex;justify-content:center;align-items:center;gap:28px}.pm button{width:56px;height:56px;border-radius:50%;background:#0008;font-size:15px;font-weight:700}.pm #ppb{width:68px;height:68px;font-size:26px}
.pb{padding-bottom:10px}.pb input[type=range]{width:100%;accent-color:var(--ac)}
.pr{display:flex;align-items:center;gap:8px;font-size:13px}.pr .sp{flex:1}.pr button{font-size:18px;padding:6px 8px}.pr select{width:auto;padding:6px 8px;font-size:13px;border-radius:8px}.pr #vl{width:70px}
.ps{position:absolute;top:50%;left:50%;margin:-22px 0 0 -22px;width:44px;height:44px;border:4px solid #fff3;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;pointer-events:none;display:none}@keyframes sp{to{transform:rotate(360deg)}}
.pz{position:absolute;left:14px;right:14px;bottom:120px;display:flex;justify-content:center;pointer-events:none}.pz .bx{pointer-events:auto;background:#000d;border-radius:12px;padding:12px 14px;font-size:14px;text-align:center;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}.pz .bx button{background:var(--ac);padding:8px 12px;border-radius:8px;font-weight:700;font-size:13px}
.pl.emb .pc{pointer-events:none;background:linear-gradient(#000a,transparent 18%)}.pl.emb .pt{pointer-events:none}.pl.emb .pt button{pointer-events:auto}.pl.emb .pm,.pl.emb .pb{display:none}
.cw{width:160px}.cw .cv{aspect-ratio:16/9}
.pg{position:absolute;left:0;right:0;bottom:0;height:4px;background:#fff3}.pg b{display:block;height:100%;background:var(--ac)}
input[type=email],input[type=password]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #2b3566;background:var(--card);color:var(--tx);font:inherit;font-size:16px}
body.ro [data-c="addc"],body.ro [data-d="addep"],body.ro [data-d="remove"],body.ro [data-d="eprem"]{display:none}
.acts.s{gap:6px}.acts.s .btn{flex:none;padding:6px 10px;font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
